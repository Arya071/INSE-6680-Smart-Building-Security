<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e14" media="(prefers-color-scheme: dark)" />
    <title>Building Security Console</title>
    <script>
      (function () {
        var choice = 'system';
        try { choice = new URLSearchParams(location.search).get('theme') || localStorage.getItem('theme') || 'system'; } catch (e) {}
        var dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
